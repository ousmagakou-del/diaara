<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>Chargement...</title>
<meta name="robots" content="noindex"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; background:#FAFAF7; color:#0A0A0A; }
  .spin { width:36px; height:36px; border-radius:50%; border:3px solid #E5E5E5; border-top-color:#1F8B4C; animation:s 0.8s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="spin" role="progressbar" aria-label="Chargement"></div>
<script>
  // Cloudflare Pages sert ce fichier quand le path ne matche pas de fichier
  // statique, AVANT que la regle _redirects "/*  /index.html 200" ne
  // s applique. Consequence : les routes SPA (/sign/xxx, /product/yyy,
  // /pharmacy/zzz, /order/aaa, /bundle/bbb, ...) tombaient sur ce 404
  // au lieu d etre gerees par le router React.
  //
  // Fix : on preserve le path original en sessionStorage puis on charge
  // / (index.html). App.jsx lit sessionStorage au boot et restore le path
  // via history.replaceState -> parseRoute -> bonne page.
  (function () {
    try {
      var full = window.location.pathname + window.location.search + window.location.hash;
      if (full && full !== '/' && full !== '/index.html') {
        sessionStorage.setItem('yaram-spa-redirect', full);
      }
    } catch (_e) {}
    window.location.replace('/');
  })();
</script>
</body>
</html>
